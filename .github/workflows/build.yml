name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q -o ./*.zip -d work

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Pruebas y APK
        working-directory: work/MadridTrenMetro
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MadridTrenMetro-debug-apk
          path: work/MadridTrenMetro/app/build/outputs/apk/debug/app-debug.apk
